spring.application.name=AME-YPD-Backend
server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:h2:mem:ame_ypd_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=AMEYPDWebsiteSecretKeyForJWTTokenGenerationThisNeedsToBeVeryLongAndSecure2024
jwt.expiration=86400000

app.admin-secret=AMEYPDAdminSecretKey2024

# File Upload Configuration
file.upload-dir=uploads/media
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve static files
spring.web.resources.static-locations=file:uploads/media/

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=placeholder@gmail.com
spring.mail.password=placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.name=AME YPD Church
app.url=http://localhost:8080
app.admin.registration.enabled=true


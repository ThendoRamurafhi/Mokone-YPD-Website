spring.application.name=AME-YPD-Backend
server.port=8080
server.servlet.context-path=/api/v1

# ══════════════════════════════════════════════════════════════
# MySQL — connects to ypd_db (name from your SQL file)
# ══════════════════════════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/ypd_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Vharafhi08%

# ══════════════════════════════════════════════════════════════
# Hibernate
# 'update' = adds missing columns/tables, never drops data
# Run the SQL schema first, then start Spring Boot
# ══════════════════════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ══════════════════════════════════════════════════════════════
# Hibernate naming: match lowercase table names in MySQ
# ══════════════════════════════════════════════════════════════
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ══════════════════════════════════════════════════════════════
# JWT
# ══════════════════════════════════════════════════════════════
jwt.secret=AMEYPDWebsiteSecretKeyForJWTTokenGenerationThisNeedsToBeVeryLongAndSecure2024
jwt.expiration=86400000

# ══════════════════════════════════════════════════════════════
# ADMIN
# ══════════════════════════════════════════════════════════════
app.admin-secret=AMEYPDAdminSecretKey2024
app.admin.registration.enabled=true

# ══════════════════════════════════════════════════════════════
# FILE UPLOAD — files on disk survive DB restarts
# ══════════════════════════════════════════════════════════════
file.upload-dir=uploads/media
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:uploads/media/

# ══════════════════════════════════════════════════════════════
# MAIL
# ══════════════════════════════════════════════════════════════
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=placeholder@gmail.com
spring.mail.password=placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ══════════════════════════════════════════════════════════════
# App
# ══════════════════════════════════════════════════════════════
app.name=AME YPD Church
app.url=http://localhost:8080

# ══════════════════════════════════════════════════════════════
# application.properties — safe to push, no real values
# ══════════════════════════════════════════════════════════════
app.superadmin.email=${SUPER_ADMIN_EMAIL}
app.superadmin.password=${SUPER_ADMIN_PASSWORD}
app.superadmin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.superadmin.firstname=${SUPER_ADMIN_FIRSTNAME:Super}
app.superadmin.lastname=${SUPER_ADMIN_LASTNAME:Admin}